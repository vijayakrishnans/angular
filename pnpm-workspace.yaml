packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tooling/*"

# pnpm 10 blocks dependency build scripts unless allow-listed; wrangler's
# workerd and esbuild (Angular's builder bundles with it too) need theirs to
# verify their platform binaries.
onlyBuiltDependencies:
  - esbuild
  - workerd
